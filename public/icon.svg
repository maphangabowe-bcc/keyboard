<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Glow border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Top Translation Banner -->
  <g filter="url(#shadow)">
    <rect x="64" y="76" width="384" height="96" rx="28" fill="#1e293b" stroke="#3b82f6" stroke-width="3" stroke-opacity="0.8" />
    <!-- Translation Globe / Sparkle icon -->
    <circle cx="116" cy="124" r="28" fill="url(#accentGrad)" />
    <!-- Globe lines -->
    <ellipse cx="116" cy="124" rx="20" ry="8" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <line x1="116" y1="98" x2="116" y2="150" stroke="#ffffff" stroke-width="2.5" />
    <line x1="92" y1="124" x2="140" y2="124" stroke="#ffffff" stroke-width="2.5" />
    
    <!-- Real-time Text in banner -->
    <text x="160" y="116" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="1">LIVE TRANSLATION</text>
    <text x="160" y="146" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800">Hola! ¿Cómo estás?</text>
  </g>

  <!-- Keyboard Keypad Base -->
  <g filter="url(#shadow)">
    <rect x="64" y="196" width="384" height="240" rx="32" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- Row 1 Keys -->
    <rect x="80" y="212" width="56" height="48" rx="12" fill="url(#keyGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="108" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Q</text>

    <rect x="146" y="212" width="56" height="48" rx="12" fill="url(#keyGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="174" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">W</text>

    <rect x="212" y="212" width="56" height="48" rx="12" fill="url(#keyGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="240" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">E</text>

    <rect x="278" y="212" width="56" height="48" rx="12" fill="url(#keyGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="306" y="244" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">R</text>

    <rect x="344" y="212" width="88" height="48" rx="12" fill="#475569" stroke="#64748b" stroke-width="1.5" />
    <!-- Backspace icon -->
    <path d="M 404 236 L 392 226 L 372 226 L 362 236 L 372 246 L 392 246 Z M 382 231 L 390 239 M 390 231 L 382 239" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Row 2 Keys -->
    <rect x="96" y="272" width="56" height="48" rx="12" fill="url(#keyGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="124" y="304" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">A</text>

    <rect x="162" y="272" width="56" height="48" rx="12" fill="url(#keyGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="190" y="304" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">S</text>

    <rect x="228" y="272" width="56" height="48" rx="12" fill="url(#keyGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="256" y="304" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">D</text>

    <rect x="294" y="272" width="56" height="48" rx="12" fill="url(#keyGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="322" y="304" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="700" text-anchor="middle">F</text>

    <rect x="360" y="272" width="72" height="48" rx="12" fill="url(#accentGrad)" />
    <text x="396" y="303" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">100%</text>

    <!-- Row 3 Bottom Keys (Language globe, spacebar, enter) -->
    <rect x="80" y="332" width="64" height="52" rx="14" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <circle cx="112" cy="358" r="14" fill="none" stroke="#ffffff" stroke-width="2" />
    <ellipse cx="112" cy="358" rx="7" ry="14" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <line x1="98" y1="358" x2="126" y2="358" stroke="#ffffff" stroke-width="1.5" />

    <!-- Big Spacebar with Active translation pill -->
    <rect x="154" y="332" width="204" height="52" rx="14" fill="url(#keyGrad)" stroke="#3b82f6" stroke-width="2" />
    <text x="256" y="364" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">PolyType Space</text>

    <!-- Return / Send button -->
    <rect x="368" y="332" width="64" height="52" rx="14" fill="#2563eb" />
    <path d="M 406 352 L 394 364 L 406 376 M 396 364 L 416 364" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Keyboard Base Indicators -->
    <circle cx="240" cy="406" r="3" fill="#60a5fa" />
    <circle cx="256" cy="406" r="4" fill="#3b82f6" />
    <circle cx="272" cy="406" r="3" fill="#60a5fa" />
  </g>
</svg>
